<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1230">
  <meta name="description" content="Beryl 的 AI 项目作品集：情绪雷达与 AI 医疗竞对日报。">
  <title>Beryl · AI 项目作品集</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-width:320px;min-height:100%;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:#fff}
    body{background:#0b1230}
    a{color:inherit;text-decoration:none}
    a:focus-visible{outline:3px solid #b6f1d7;outline-offset:4px}
    .cover{min-height:100svh;display:flex;align-items:center;position:relative;isolation:isolate;overflow:hidden;background:url("./assets/observatory-bg.png?v=1") center/cover no-repeat}
    .cover::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(7,12,35,.66) 0%,rgba(7,12,35,.38) 37%,transparent 71%)}
    .content{width:min(565px,calc(100% - 92px));margin-left:clamp(42px,6.4vw,100px);padding:42px 0}
    h1{font-family:"Iowan Old Style","Songti SC","STSong",serif;font-size:34px;font-weight:300;letter-spacing:.045em;margin:0 0 11px;text-shadow:0 3px 20px #080b24aa}
    .intro{margin:0 0 38px;color:#f6e9e3;letter-spacing:.11em;font-size:15px;font-weight:300;text-shadow:0 2px 12px #080b24aa}
    .cards{display:grid;gap:16px}
    .card{min-height:144px;display:flex;align-items:center;gap:21px;border:1px solid rgba(255,255,255,.28);border-radius:21px;padding:22px 24px;background:rgba(13,21,45,.84);box-shadow:0 20px 45px #080c2680;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:transform .2s,border-color .2s,background .2s}
    .card:hover{transform:translateX(5px);border-color:#e6c4b7bb;background:rgba(21,29,56,.92)}
    .card:active{transform:translateX(2px)}
    img{width:88px;height:88px;flex:none;border-radius:17px;object-fit:cover;box-shadow:0 7px 22px #0007}
    .copy{min-width:0}
    h2{font-size:27px;line-height:1.25;letter-spacing:.01em;margin:0 0 7px;font-weight:650}
    .desc{font-size:13px;color:#e9e8f0bb;line-height:1.5;margin:0}
    .arrow{margin-left:auto;display:grid;place-items:center;flex:none;width:43px;height:43px;border-radius:50%;border:1px solid #fff6;font-size:22px;font-weight:300}
    @media(max-width:700px){.cover{background-position:81% center;align-items:flex-end}.cover::before{background:linear-gradient(180deg,#07102533 8%,#0710253a 42%,#071025e8 100%)}.content{width:calc(100% - 36px);margin:0 auto;padding:140px 0 26px}h1{font-size:27px}.intro{font-size:12px;margin-bottom:22px}.card{min-height:100px;padding:14px;gap:14px;border-radius:16px}img{width:60px;height:60px;border-radius:12px}h2{font-size:20px}.desc{font-size:11px}.arrow{width:34px;height:34px;font-size:18px}}
    @media(prefers-reduced-motion:reduce){.card{transition:none}}
  </style>
</head>
<body>
  <main class="cover">
    <section class="content" aria-label="作品集项目">
      <h1>Beryl作品集</h1>
      <p class="intro">点击下方标签，浏览具体项目</p>
      <div class="cards">
        <a class="card" href="./emotion.html?v=4" aria-label="打开情绪雷达演示"><img src="./assets/radar-icon.jpg" alt="" width="88" height="88"><span class="copy"><h2>情绪雷达</h2><p class="desc">新闻情绪、行情与泡泡玛特预测回放</p></span><span class="arrow" aria-hidden="true">→</span></a>
        <a class="card" href="./medical.html?v=4" aria-label="打开 AI 医疗竞对日报演示"><img src="./assets/report-icon.jpg" alt="" width="88" height="88"><span class="copy"><h2>AI 医疗竞对日报</h2><p class="desc">多 Agent 生成流程与完整日报回放</p></span><span class="arrow" aria-hidden="true">→</span></a>
      </div>
    </section>
  </main>
</body>
</html>
